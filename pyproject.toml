[project]
name = "ezwork-tool"
version = "0.1.0"
description = "Unified CLI: web/image search (Doubao / AnySearch / DeepSeek) + URL-to-Markdown fetch. One tool, one skill."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eztool = "ezwork_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezwork_tool"]
