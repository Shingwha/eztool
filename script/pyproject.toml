[project]
name = "ezwork-tool"
version = "0.1.1"
description = "Unified CLI: web/image search (Doubao / AnySearch / DeepSeek) + URL-to-Markdown fetch. One tool, one skill."
readme = {text = "ezwork-tool: unified search / paper search / fetch / convert CLI (see repo root README.md)", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = []

# 可选依赖：本地 PDF 解析（Firecrawl pdf-inspector，Rust 核心，无 OCR）。
# Windows/macOS/glibc-Linux 有官方轮子：uv tool install --extra local .
# musl（Alpine 等）无 musllinux 轮子，源码构建需 Rust 工具链 —— 不装 extra 即可，
# eztool 的 pdfinspector provider 会自动检测缺失并在 convert 回退链中跳过。
[project.optional-dependencies]
local = ["pdf-inspector>=0.2.6"]

[project.scripts]
eztool = "ezwork_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezwork_tool"]
