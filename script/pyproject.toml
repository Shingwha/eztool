[project]
name = "eztool"
version = "0.4.0"
description = "Unified CLI: search (web/image/data) + fetch (URL to Markdown) + convert (file to Markdown) + config. One tool, one skill."
readme = {text = "eztool: unified search / fetch / convert / config CLI (see repo root README.md)", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = []

# 可选依赖：本地文档解析（Firecrawl anydoc，Rust 核心，14 格式，无 OCR）。
# Windows/macOS/glibc/musl 均有官方轮子：uv tool install ".[local]"
# 不装 extra 也可——anydoc provider 会自动检测缺失并跳过（纯文本/HTML 等不需该库）。
[project.optional-dependencies]
local = ["firecrawl-anydoc>=0.1.3"]

[project.scripts]
eztool = "eztool.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eztool"]
