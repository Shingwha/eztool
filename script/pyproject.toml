[project]
name = "ezwork-tool"
version = "0.3.0"
description = "Unified CLI: search (web/image/paper/data) + convert (URL/file to Markdown) + config. One tool, one skill."
readme = {text = "ezwork-tool: unified search / convert / config CLI (see repo root README.md)", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = []

# 可选依赖：本地文档解析（Firecrawl anydoc，Rust 核心，14 格式，无 OCR）。
# Windows/macOS/glibc/musl 均有官方轮子：uv tool install ".[local]"
# 不装 extra 也可——anydoc provider 会自动检测缺失并跳过（纯文本/HTML 等不需该库）。
[project.optional-dependencies]
local = ["firecrawl-anydoc>=0.1.3"]

[project.scripts]
eztool = "ezwork_tool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezwork_tool"]
